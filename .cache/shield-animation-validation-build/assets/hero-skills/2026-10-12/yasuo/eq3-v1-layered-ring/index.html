</head><body><h1>亚索 EQ3 · 多层独立环斩</h1><p>在普通 EQ 基础上增加上下错开的风刃层。独立特效跟随 E 八向人物位移，不改人物帧；三层风圈分别按前后弧拆分：后弧在人物后方，前弧覆盖人物前方。可隐藏人物单看特效，或切换普通 EQ 对比。此页是视觉试验，不含敌人交互或伤害判定，尚未接入主游戏。</p><p style="color:#f0bc83">预览稿：顶部风圈仍有裁边，尚未达到正式素材标准。当前仅显示有效环斩帧，隐藏起手残留；未接入主游戏。</p><div id="directions"></div><h2 id="heading">右下 ↘</h2><canvas id="stage" width="480" height="360"></canvas><div class="controls"><button id="once">播放一次</button><button id="loop">循环播放</button><button id="pause">暂停 / 继续</button><select id="speed"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速度</option></select><label><input id="body" type="checkbox" checked>显示人物</label><label><input id="ordinary" type="checkbox">对照普通 EQ</label><label><input id="fx" type="checkbox" checked>显示环斩</label></div><p id="status">加载素材…</p><input id="scrub" type="range" min="0" max="600" step="1" value="0"><h2>八个方向 · 同步对照</h2><div id="grid"></div></body></html>
