<p>YASUO / Q / WIND CAST / EAST</p>
<h1>亚索 Q · 风托刀</h1>
<p>手改为施法手势，不再握刀。刀独立悬浮，淡蓝色气流包裹刀身。保留旧版供对比，尚未接入游戏。</p>
<div class="toolbar">
<button id="once" disabled>施法一次</button><button id="repeat" disabled>循环检查</button><button id="pause" disabled>暂停</button>
<label>像素倍率 <select id="zoom" aria-label="像素倍率"><option value="1" selected>1× 原生</option><option value="2">2× 整数放大</option></select></label>
<label>速度 <select id="speed" aria-label="动画速度"><option value="1">1× · 480ms</option><option value="0.5">0.5× 慢速检查</option></select></label>
<label><input id="joints" type="checkbox">显示手刀间距</label>
</div>
<div class="panels">
<section><h2>手势施法 · 手不接触刀</h2><div class="viewport"><canvas id="rig" class="checker" width="256" height="160" aria-label="手不接触刀的亚索施法动画"></canvas></div><p>抬手聚风 → 推出 → 风托刀刺击 → 风散收手</p></section>
<section><h2>地图上的游戏尺寸检查</h2><div class="viewport"><canvas id="scene" width="256" height="160" aria-label="地图上的风托刀技能样稿"></canvas></div><p>沿用当前地图与英雄比例，仅背景合成，不含命中判定。</p></section>

<p class="note">只做朝右。身体和上臂沿用旧版原像素；施法手与缠风刀由 game-assets 修改，气流的流动和出现/消散由代码驱动。身体仍是固定姿态，未扩展八向。</p>
