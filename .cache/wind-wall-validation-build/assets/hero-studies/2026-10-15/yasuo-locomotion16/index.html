<body>
  <h1>亚索 · 八向走路与待机 · 16 帧</h1>
  <p>普通走路放缓至每轮 1.28 秒，加速走路保持每轮 0.8 秒；两种状态均使用完整 16 帧，待机节奏保持原样。可切换回原版 8 帧与新版 16 帧对比。</p>
  <div class="tools">
    <button id="play">暂停</button><button id="step">下一帧</button>
    <label>对比 <select id="comparison"><option value="movement">普通 / 加速</option><option value="frames">8 帧 / 16 帧</option></select></label>
    <label>速度 <select id="speed"><option value="1">原速</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label>
    <label>显示 <select id="zoom"><option value="1">1×</option><option value="2">2×</option></select></label>
    <input id="seek" type="range" min="0" max="15" value="0" aria-label="动画帧">
    <output id="frame">加载中…</output><span id="status" class="status"></span>
  </div>
  <section><h2>走路</h2><div id="walk" class="grid"></div></section>
  <section><h2>待机</h2><div id="idle" class="grid"></div></section>
  <p><a href="../../../../?map=howling">进入冰桥对局</a> · <a href="../yasuo-current-locomotion/index.html">查看原版 8 帧素材</a></p>
