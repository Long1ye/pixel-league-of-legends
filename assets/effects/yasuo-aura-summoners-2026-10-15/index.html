<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓄风 · 闪现 · 点燃</title>
<style>body{margin:0;background:#0b1420;color:#dceef5;font:16px system-ui;padding:32px}h1{font-size:24px}p{color:#91adbd}.cards{display:flex;flex-wrap:wrap;gap:24px}article{background:#152333;border:1px solid #345065;padding:16px;text-align:center}canvas{display:block;image-rendering:pixelated;background:repeating-conic-gradient(#182b39 0% 25%,#142431 0% 50%) 0/24px 24px}a{color:#9fe9ff}button{background:#263e51;color:#dceef5;border:1px solid #45677d;padding:10px;cursor:pointer}</style>
<h1>蓄风 · 闪现 · 点燃</h1><p>淡蓝色上升气焰、金白色爆闪、橙红色燃烧。<a href="/?map=howling&practice=combat">进入战斗练习：D 闪现 / F 点燃</a></p>
<div class="cards"><article><h2>Q3 蓄风</h2><canvas id="wind" width="256" height="320"></canvas></article><article><h2>D · 闪现</h2><canvas id="flash" width="256" height="320"></canvas></article><article><h2>F · 点燃</h2><canvas id="ignite" width="256" height="320"></canvas></article></div>
<p><button id="pause">暂停动画</button></p>
<script type="module">const atlas=new Image();atlas.src=new URL('./runtime/vfx-atlas.png',import.meta.url).href;let paused=false,t=0,last=0;const views=['wind','flash','ignite'].map(id=>document.getElementById(id).getContext('2d'));document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续动画':'暂停动画'};function draw(now){if(last&&!paused)t+=(now-last)/1000;last=now;const frame=Math.floor(t*12)%4;for(const c of views){c.clearRect(0,0,256,320);c.imageSmoothingEnabled=false}if(atlas.complete&&atlas.naturalWidth){views[0].drawImage(atlas,frame*256,0,256,320,0,0,256,320);views[0].drawImage(atlas,frame*256,320,256,320,0,0,256,320);const age=t%1.3;if(age<.5)views[1].drawImage(atlas,Math.min(3,Math.floor(age/.09))*256,640,256,320,0,0,256,320);views[2].drawImage(atlas,frame*256,960,256,320,0,0,256,320)}requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
