<p>YASUO / SWEEPING BLADE / GENERATED CHARACTER MOTION</p><h1>E · 正右方向专用动作</h1>
<p>Skill 新绘制的全身动画，不再用走路帧代替。先独立检查动作，尚未替换主游戏素材。</p>
<div class="stage"><canvas id="animation" aria-label="亚索踏前斩动画"></canvas></div>
<button id="once">播放一次</button><button id="loop">循环检查</button><button id="pause">暂停</button>
<select id="speed" aria-label="播放速度"><option value="1">原始速度</option><option value="0.5">半速检查</option><option value="game">0.32 秒游戏节奏</option></select>
<p id="status"></p><input id="scrub" aria-label="逐帧查看" type="range" min="0" max="7" step="1" value="0">
<p>检查结论：中段偏宽幅横斩、刀光偏宽，末尾停在持刀收势，尚未达到低姿态穿身斩目标。暂不接入游戏。循环仅用于反复检查，不代表无缝衔接；游戏节奏只改变播放速度，不删帧、不插帧。</p>
