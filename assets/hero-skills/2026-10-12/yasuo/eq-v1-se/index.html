<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亚索 EQ · 右下环斩试作</title>
<style>body{background:#111b25;color:#e2edf5;font:16px system-ui;margin:32px auto;max-width:1000px;padding:0 20px}h1{font-size:26px}p{color:#aabecb;line-height:1.7}canvas{image-rendering:pixelated;background:#243641}#animation{display:block;margin:20px auto}button,select{background:#243949;color:#e2edf5;border:1px solid #4b6a7b;padding:10px;border-radius:6px;cursor:pointer}#frames{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;overflow:auto}figure{margin:0}figcaption{font-size:13px;color:#aabecb}#scrub{width:100%}pre{white-space:pre-wrap;line-height:1.7;color:#aabecb}a{color:#8cdbed}</style></head>
<body><style>#frames{grid-template-columns:repeat(auto-fit,minmax(176px,1fr));overflow:visible}figure canvas{display:block}</style><h1>亚索 EQ · 右下环斩试作</h1><p>以现有 E 持刀姿势起手，尝试一次横向环斩和淡蓝风刃。这里只展示新生成的动作，尚未接入游戏，也不包含位移或伤害判定。</p>
<canvas id="animation"></canvas>
<button id="once">播放一次</button> <button id="loop">循环播放</button> <button id="pause">暂停 / 继续</button>
<select id="speed"><option value="1">原始速度</option><option value="0.5">半速检查</option><option value="game">400ms 节奏试播</option></select>
<p id="status">加载动画…</p><input id="scrub" type="range" min="0" value="0" step="1">
<h2>逐帧检查 · 原尺寸</h2><div id="frames"></div><h2>生成 Prompt · 自动优化开启</h2><pre id="prompt"></pre>
