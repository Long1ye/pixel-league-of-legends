<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亚索 EQ · 八向位移合成</title><style>body{max-width:1080px;margin:28px auto;padding:0 18px;background:#101d26;color:#d9eaf1;font:15px system-ui}h1{font-size:26px}p{line-height:1.7;color:#9fbcc9}canvas{image-rendering:pixelated;display:block}#stage{margin:20px 0}button,select{padding:9px 12px;background:#244452;border:1px solid #527080;color:#e2f3f6;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#356773;border-color:#99e7ef}#directions,.controls{display:flex;gap:8px;flex-wrap:wrap}#scrub{width:100%}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}figure{margin:0}figcaption{padding:8px}a{color:#a1e4ed}</style></head><body><h1>亚索 EQ · 八向位移合成</h1><p>保留已确认的 E 八向人物动画，只增加独立环斩。风圈跟随角色，后半圈在身后、前半圈在身前，不随方向旋转。此页是视觉试验，不含敌人交互或伤害判定，尚未接入主游戏。</p><div id="directions"></div><h2 id="heading">右下 ↘</h2><canvas id="stage" width="480" height="360"></canvas><div class="controls"><button id="once">播放一次</button><button id="loop">循环播放</button><button id="pause">暂停 / 继续</button><select id="speed"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速度</option></select><label><input id="fx" type="checkbox" checked>显示环斩</label></div><p id="status">加载素材…</p><input id="scrub" type="range" min="0" max="600" step="1" value="0"><h2>八个方向 · 同步对照</h2><div id="grid"></div><script type="module" src="./preview.ts"></script></body></html>
