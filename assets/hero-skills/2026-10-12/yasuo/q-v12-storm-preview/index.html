<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亚索 Q · 蓄风与任意方向龙卷风</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b151d;color:#dfedf4}body{margin:0;padding:22px}main{max-width:920px;margin:auto}h1{font-size:25px;margin:7px 0 12px}p{color:#9db4bf;line-height:1.65;font-size:14px}.kicker{color:#6fbed1;letter-spacing:3px;font-size:11px}.stage{overflow:auto;border:1px solid #31515e;border-radius:12px;background:#14242b}canvas{display:block;margin:auto;image-rendering:pixelated;cursor:crosshair;touch-action:none}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}button,select{font:inherit;font-size:13px;padding:9px 13px;border:1px solid #41616f;background:#203740;color:#e6f4fa;border-radius:6px;cursor:pointer}button:hover{background:#365462}button.active{background:#33788a;border-color:#a5e3f0}input[type=range]{flex:1;min-width:180px;accent-color:#74c9df}label{font-size:13px;display:flex;align-items:center;gap:6px}output{color:#abe5ee;font-size:13px}.note{background:#152a34;border-left:3px solid #64bdd5;padding:12px}a{color:#9bdced}.assets{display:flex;gap:24px;flex-wrap:wrap}.assets figure{margin:0;background:#20333d;padding:12px;border-radius:8px}.assets img{image-rendering:pixelated}.assets figcaption{font-size:12px;color:#b6ccd5;margin-top:8px}details{margin-top:20px}summary{cursor:pointer}@media(max-width:600px){body{padding:12px}}
</style></head><body><main><div class="kicker">YASUO / GATHERING STORM / FIRST STUDY</div><h1>蓄风 → 横斩 → 龙卷风</h1><p>Q2 命中后的风持续环绕人物；释放 Q3 时复用现有 W 横斩动作。<br>在场景内移动鼠标瞄准，点击发射；也可选择方向或拖动角度滑杆。</p>
<div class="stage"><canvas id="scene" width="560" height="510" aria-label="亚索蓄风和任意方向龙卷风预览"></canvas></div>
<div class="controls"><button id="ready">模拟 Q2 命中 · 蓄风</button><button id="cast">释放 Q3</button><button id="pause">暂停</button><label><input id="loop" type="checkbox" checked>自动演示</label><label>速度<select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label></div>
<div class="controls"><label for="angle">瞄准角度</label><input id="angle" type="range" min="0" max="359" step="1" value="0"><output id="angleValue">0°</output></div>
<div class="controls" id="directions"><button data-angle="225">左上</button><button data-angle="270">正上</button><button data-angle="315">右上</button><button data-angle="180">正左</button><button data-angle="0">正右</button><button data-angle="135">左下</button><button data-angle="90">正下</button><button data-angle="45">右下</button></div>
<div class="controls"><output id="status" role="status">加载素材…</output></div><div class="controls"><label for="scrub">查看时序</label><input id="scrub" type="range" min="0" max="4100" step="10" value="0"></div>
<p class="note">本页是独立美术试版，没有修改主游戏。人物暂时固定使用已选 W 朝向，不旋转人物；龙卷风的飞行轨迹支持任意角度，风柱始终竖直。虚线表示瞄准方向，圆点表示风柱脚底位置。</p>
<details><summary>查看独立透明动画</summary><div class="assets"><figure><img id="readyClip" alt="蓄风循环"><figcaption>绕身蓄风 · 独立透明循环</figcaption></figure><figure><img id="stormClip" alt="龙卷风循环"><figcaption>竖直龙卷风 · 独立透明循环</figcaption></figure></div></details><p><a href="/">返回主游戏</a></p>
</main><script type="module" src="./preview.ts"></script></body></html>
