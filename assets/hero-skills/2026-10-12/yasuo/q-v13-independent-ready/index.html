<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亚索 · 独立蓄风与行走</title><style>
:root{color-scheme:dark;background:#0d1820;color:#e0eef5;font-family:system-ui,sans-serif}body{margin:0;padding:24px}main{max-width:850px;margin:auto}h1{font-size:26px}p{color:#a2bbc7;line-height:1.7;font-size:14px}.stage{overflow:auto;background:#182e37;border:1px solid #345564;border-radius:12px}canvas{display:block;margin:auto;image-rendering:pixelated}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}button,select{background:#243f4c;color:#e3f5fa;border:1px solid #466979;border-radius:6px;padding:8px 12px;font:inherit;font-size:13px}button{cursor:pointer}button[aria-pressed=true]{background:#34798b}label{display:flex;align-items:center;gap:6px;font-size:13px}output{font-size:13px;color:#a0dce7}a{color:#9eddec}.note{border-left:3px solid #62b6ca;background:#172c36;padding:12px}.kicker{font-size:11px;letter-spacing:3px;color:#7ebbcf}img{image-rendering:pixelated}details{margin:18px 0}summary{cursor:pointer}</style></head><body><main>
<div class="kicker">YASUO / INDEPENDENT READY VFX</div><h1>人物照常行动，蓄风独立跟随</h1><p>新生成的透明蓄风循环 + 游戏现有八向行走 / 待机。<br>切换方向、停下或暂停人物，不会重启风的动画。</p>
<div class="stage"><canvas id="scene" width="560" height="360" aria-label="人物与独立蓄风合成预览"></canvas></div>
<div class="controls"><label>人物动作<select id="motion"><option value="walk">正常行走</option><option value="idle">原地待机</option></select></label><label>显示图层<select id="layers"><option value="both">人物 + 蓄风</option><option value="body">仅人物</option><option value="wind">仅蓄风</option></select></label><label><input id="moving" type="checkbox" checked>人物在场景中移动</label><label><input id="bodyPaused" type="checkbox">仅暂停人物</label></div>
<div class="controls" id="directions"><button data-dir="nw">左上</button><button data-dir="n">正上</button><button data-dir="ne">右上</button><button data-dir="w">正左</button><button data-dir="e">正右</button><button data-dir="sw">左下</button><button data-dir="s">正下</button><button data-dir="se">右下</button></div>
<div class="controls"><button id="windToggle">关闭蓄风</button><button id="pause">全部暂停</button><button id="reset">位置复位</button><label>风的速度<select id="windSpeed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="1.5">1.5×</option></select></label></div>
<output id="status" role="status">加载动画…</output><p class="note">风的动画时钟独立于人物动作；两者只共用人物位置。绘制顺序：后层风 → 人物 → 前层风。关闭蓄风只隐藏特效，不影响行走。本页为美术试版，未接入主游戏。</p>
