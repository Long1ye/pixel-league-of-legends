<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q · 用户剑动画与轻刺</title><style>body{margin:24px;background:#12252e;color:#deedf2;font:15px system-ui}p{max-width:760px;line-height:1.7;color:#b9ced7}canvas{width:640px;height:440px;image-rendering:pixelated;background:repeating-conic-gradient(#20343d 0% 25%,#263c44 0% 50%) 0/20px 20px}button,select{padding:10px;margin:5px;background:#285463;color:white;border:1px solid #7da4b5}input[type=range]{width:400px}a{color:#98d9ff}</style><h1>Q · 流光剑 / 轻微前送</h1><p>采用你提供的 16 帧剑动画，按一次 Q 的 480 ms 节奏播放。手腕仅前送约 3.5 像素，肩—肘—腕联动，臂长固定，剑柄绑定握刀手。独立试版，未替换主游戏。</p><canvas id="stage" width="320" height="220"></canvas><div><button id="attack">发动一次 Q</button><button id="loop">循环开 / 关</button><select id="speed" aria-label="速度"><option value="1">原速</option><option value="0.5">半速</option><option value="0.25">四分之一速度</option></select></div><label>逐帧 <input id="scrub" type="range" min="0" max="480" value="0"></label><p id="status">加载中</p><script type="module" src="./preview.ts"></script></html>
