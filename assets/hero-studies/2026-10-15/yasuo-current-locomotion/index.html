<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>现有亚索八向走路与待机</title><style>body{margin:24px;background:#0c1520;color:#dceaf0;font:16px system-ui}button{padding:8px 16px;margin-right:12px}canvas{display:block;max-width:none;image-rendering:pixelated;background:#213241}section{overflow:auto}h2{font-size:18px}p{color:#9fb5c7}a{color:#a8dcee}</style><h1>旧版亚索 · 八向走路与待机（8 帧存档）</h1><p><a href="../yasuo-locomotion16/index.html?zoom=2#walk-ne">查看当前游戏的 16 帧版本与普通／加速对比 →</a></p><p>此页保留升级前的原始图集，当前游戏已使用 16 帧版。每方向 8 帧，每帧 100 ms，循环 0.8 秒。仅提取展示，未修改素材。</p><button id="play">暂停</button><button id="step">下一帧</button><span id="frame"></span><section><h2>待机</h2><canvas id="idle" width="1024" height="168"></canvas><h2>走路</h2><canvas id="walk" width="1024" height="168"></canvas></section><p><a href="idle-eight-directions.png">待机八向首帧总览 PNG</a> · <a href="walk-eight-directions.png">走路八向首帧总览 PNG</a></p><script type="module">
const clips=await(await fetch('./clips.json')).json();
const directions=['n','ne','e','se','s','sw','w','nw'];
const labels={n:'上 N',ne:'右上 NE',e:'右 E',se:'右下 SE',s:'下 S',sw:'左下 SW',w:'左 W',nw:'左上 NW'};
const images=new Map(await Promise.all(clips.map(async c=>{const img=new Image();img.src=c.sheet;await img.decode();return[c.sheet,img]})));
let playing=true,frame=0,last=performance.now();
function draw(){for(const state of ['idle','walk']){const ctx=document.getElementById(state).getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,1024,168);directions.forEach((d,i)=>{const c=clips.find(c=>c.state===state&&c.direction===d),x=i*128;for(let y=0;y<128;y+=16)for(let px=0;px<128;px+=16){ctx.fillStyle=(y/16+px/16)%2?'#1d2d3a':'#243847';ctx.fillRect(x+px,y,16,16)}ctx.drawImage(images.get(c.sheet),(frame%c.columns)*128,Math.floor(frame/c.columns)*128,128,128,x,0,128,128);ctx.fillStyle='#dceaf0';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText(labels[d],x+64,152);});}document.getElementById('frame').textContent=`第 ${frame+1} / 8 帧`;}
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放';last=performance.now()};document.getElementById('step').onclick=()=>{playing=false;document.getElementById('play').textContent='播放';frame=(frame+1)%8;draw()};function tick(now){if(playing&&now-last>=100){const n=Math.floor((now-last)/100);frame=(frame+n)%8;last+=n*100;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></html>
