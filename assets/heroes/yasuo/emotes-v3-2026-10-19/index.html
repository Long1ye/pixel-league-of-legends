<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>亚索 · 高帧率循环表情</title><style>body{background:#202833;color:#e4eaf1;font:16px system-ui;padding:24px}main{display:flex;flex-wrap:wrap;gap:16px}article{background:#303845;padding:12px}canvas{image-rendering:pixelated;background:linear-gradient(#323e49,#424d51)}button,select{font:inherit;padding:7px;margin:5px}p,small{color:#aebdcd}small{display:block;margin:5px 0}h1{font-size:28px}</style><h1>亚索 · 高帧率循环表情</h1><p>新版为 1080P Full · Detailed · 90 帧 / 4 秒 · 精细抠图。三段均已抠图并接入游戏，按原始时序持续循环。按 1 / 2 / 4 从头循环，游戏内持续播放直到移动、攻击、施法或受击打断。</p><label>显示倍率 <select id="zoom"><option selected>1</option><option>2</option><option>3</option><option>4</option></select></label><button id="pause">暂停</button><button id="restart">从头播放</button><button id="previous">上一帧</button><button id="next">下一帧</button><main id="cards"></main><script type="module">
const emotes=(await (await fetch('./animations.json')).json()).clips;
const locomotion=(await (await fetch('../locomotion16-2026-10-15/animations.json')).json()).locomotion;
const specs=[...locomotion.filter(c=>c.direction==='se').map(c=>({...c,title:c.state==='idle'?'正式待机':'正式走路',url:'../locomotion16-2026-10-15/runtime/'+c.sheet,seconds:c.state==='walk'?1.04:.8})),...emotes.map(c=>({...c,title:{joke:'1 · 抛酒壶接刀',taunt:'2 · 饮酒洒刃',laugh:'4 · 大笑'}[c.action],url:'./'+c.sheet,seconds:c.duration_ms/1000}))];
let elapsed=0,previous=performance.now(),paused=false;
for(const c of specs){const card=document.createElement('article');card.innerHTML='<div>'+c.title+'</div><small>'+c.frame_count+' 帧 · '+(c.frame_count/c.seconds).toFixed(1)+' fps · 循环</small><canvas width="192" height="176"></canvas>';cards.append(card);c.canvas=card.querySelector('canvas');c.image=new Image();c.image.src=c.url;await c.image.decode();}
function size(){for(const c of specs){c.canvas.style.width=192*Number(zoom.value)+'px';c.canvas.style.height=176*Number(zoom.value)+'px';}}size();zoom.onchange=size;
function pauseLabel(){pause.textContent=paused?'继续':'暂停';}
pause.onclick=()=>{paused=!paused;pauseLabel();};restart.onclick=()=>elapsed=0;
const step=emotes[0].duration_ms/1000/emotes[0].frame_count;document.getElementById('previous').onclick=()=>{paused=true;elapsed=Math.max(0,elapsed-step);pauseLabel();};document.getElementById('next').onclick=()=>{paused=true;elapsed+=step;pauseLabel();};
window.onkeydown=e=>{if(['1','2','4'].includes(e.key)){elapsed=0;paused=false;pauseLabel();}};
function tick(now){if(!paused)elapsed+=(now-previous)/1000;previous=now;for(const c of specs){const age=elapsed%c.seconds;let ms=age/c.seconds*c.duration_ms,frame=0;while(frame<c.frame_count-1&&ms>=c.durations_ms[frame])ms-=c.durations_ms[frame++];const ctx=c.canvas.getContext('2d');ctx.clearRect(0,0,192,176);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#829a99';ctx.fillRect(90,151,12,1);ctx.drawImage(c.image,frame%c.columns*c.width,Math.floor(frame/c.columns)*c.height,c.width,c.height,96-c.anchor[0],152-c.anchor[1],c.width,c.height);}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
