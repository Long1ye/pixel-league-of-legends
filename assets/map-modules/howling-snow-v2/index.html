<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>冰桥积雪 · 覆盖变化</title><style>body{background:#102132;color:#c9e4ed;font:14px system-ui;padding:18px}canvas,img{image-rendering:pixelated;display:block}section{overflow:auto;margin-top:20px}button{padding:8px;margin-right:12px}p{color:#a2becb}</style><h1>积雪覆盖变化 · V2</h1><p>从上到下：碎雪 / 断带 / 残雪 / 厚雪。独立贴片，不是自动衔接雪边。</p><button id="toggle">切换石砖底层</button><section><canvas width="592" height="368"></canvas></section><p>以原生尺寸检查每格。旧资源保留，尚未替换主游戏。</p><script type="module">
const load=s=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=s});const [snow,stone]=await Promise.all([load('./snow.png'),load('../howling-v1/stone.png')]);const c=document.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;let base=true;function draw(){c.fillStyle='#102132';c.fillRect(0,0,592,368);for(let r=0;r<4;r++)for(let col=0;col<4;col++){const x=8+col*144,y=8+r*88;if(base)c.drawImage(stone,256,64,128,64,x,y,128,64);c.drawImage(snow,col*128,r*64,128,64,x,y,128,64);c.fillStyle='#85a8ba';c.font='11px system-ui';c.fillText(`${r+1}-${col+1}`,x+54,y+78);}}document.querySelector('#toggle').onclick=()=>{base=!base;draw()};draw();
</script></html>
