<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>冰桥 · 修补与战损素材</title>
<style>body{background:#101c28;color:#d0e0e9;font:16px system-ui;margin:24px}h1{font-size:24px}section{display:flex;gap:18px;flex-wrap:wrap}figure{margin:0 0 24px}img{display:block;width:512px;height:512px;image-rendering:pixelated}.overlay{background:url('../howling-stones-v2/stone-00.png') repeat}figcaption{padding:10px}p{color:#9ab4c4}</style>
<h1>冰桥 · 修补石砖与战损覆盖层</h1><p>第一批：4 种修补砖 + 4 种透明战损。原生 512px 单格展示；尚未接入游戏。战损下方平铺旧石砖用于检查透明边缘。</p>
<section id="tiles"></section><script>
const names=['补缝修复','新旧替换砖','铁件加固','边角修补','分叉裂痕','浅击坑与碎屑','刀刮痕','零散碎石'];
for(let i=0;i<8;i++){const figure=document.createElement('figure');const image=document.createElement('img');image.src=`${i<4?'repair':'damage'}-${i%4}.png`;if(i>=4)image.className='overlay';image.alt=names[i];const label=document.createElement('figcaption');label.textContent=names[i];figure.append(image,label);document.querySelector('#tiles').append(figure);}
</script></html>
