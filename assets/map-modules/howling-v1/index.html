<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>冰桥模块 · 第一批</title><style>body{background:#101e2c;color:#d2e6ed;font:14px system-ui;margin:24px}h1{font-size:22px}canvas,img{image-rendering:pixelated}section{overflow:auto;border:1px solid #38505e;margin:16px 0}label,button{margin-right:20px}a{color:#9cd7ea}figure{display:inline-block;margin:12px 24px 12px 0}p{color:#9bafb8}button{padding:6px 12px}</style><h1>冰桥模块 · 石面 + 独立积雪层</h1><p>第一批拼接资源，128×64 等距单元。非整张地图；材质细节尚需与已确认样板进一步匹配。</p><label><input id="snow" type="checkbox" checked>显示积雪</label><label><input id="grid" type="checkbox">显示单元格</label><button id="gap">切换草丛预留缺口</button><section><canvas width="768" height="384"></canvas></section><figure><a href="stone.png"><img src="stone.png" width="512" height="256"></a><figcaption>石面：16 个过渡单元（含空单元）</figcaption></figure><figure><a href="snow.png"><img src="snow.png" width="512" height="256"></a><figcaption>积雪覆盖层：16 个过渡单元（含空单元）</figcaption></figure><script type="module">
const load=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});const [stone,snow]=await Promise.all(['stone.png','snow.png'].map(load));const ctx=document.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;const cells=[[0,3],[3,3],[0,0],[3,2],[0,2],[1,2],[2,3],[3,1],[1,3],[0,1],[3,0],[2,0],[1,0],[2,2],[1,1],[2,1]];let gap=true;
function layer(im,filled){for(let sum=0;sum<=9;sum++)for(let r=0;r<=3;r++){const c=sum-r;if(c<0||c>6)continue;const k=+filled(c-1,r-1)+2*filled(c-1,r)+4*filled(c,r-1)+8*filled(c,r);if(!k)continue;const [sx,sy]=cells[k];ctx.drawImage(im,sx*128,sy*64,128,64,256+(c-r)*64-64,32+(c+r)*32-32,128,64);}}
function draw(){ctx.fillStyle='#102132';ctx.fillRect(0,0,768,384);const inside=(c,r)=>c>=0&&c<6&&r>=0&&r<3;layer(stone,inside);if(document.querySelector('#snow').checked)layer(snow,(c,r)=>inside(c,r)&&r===0&&(!gap||c!==2&&c!==3));if(document.querySelector('#grid').checked){ctx.strokeStyle='#67b4bd60';for(let r=0;r<=3;r++)for(let c=0;c<=6;c++){const x=256+(c-r)*64,y=32+(c+r)*32;ctx.beginPath();ctx.moveTo(x,y-32);ctx.lineTo(x+64,y);ctx.lineTo(x,y+32);ctx.lineTo(x-64,y);ctx.closePath();ctx.stroke();}}}
document.querySelector('#gap').onclick=()=>{gap=!gap;draw()};document.querySelector('#snow').onchange=draw;document.querySelector('#grid').onchange=draw;draw();
</script></html>
