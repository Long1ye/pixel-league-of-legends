<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>反馈位置修复</title><style>body{margin:0;background:#101721;color:#dce5ed;font:16px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:8px}img{display:block;width:100%;max-width:1600px;margin:auto}</style><header><button id="play">暂停</button><select id="case"><option value="wall-fire">墙上火焰</option><option value="blue-ice">蓝方冰晶</option><option value="red-ice">红方冰晶</option><option value="tower-flag">塔旗</option><option value="brazier">火盆遮挡</option></select><select id="size"><option value="normal">正常视野</option><option value="detail">局部原比例裁切</option></select><span>45° · 缩放 0.6 · 8 张/秒采样，非帧率测试</span></header><img id="frame" src="wall-fire-00.jpg"><script>let frame=0,playing=true;function show(){const detail=document.querySelector('#size').value==='detail',img=document.querySelector('#frame');img.style.width=detail?'auto':'100%';img.style.maxWidth=detail?'100%':'1600px';img.src=document.querySelector('#case').value+(detail?'-detail-':'-')+String(frame).padStart(2,'0')+'.jpg'}document.querySelector('#case').onchange=show;document.querySelector('#size').onchange=show;document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放'};setInterval(()=>{if(playing){frame=(frame+1)%16;show()}},125)</script></html>
