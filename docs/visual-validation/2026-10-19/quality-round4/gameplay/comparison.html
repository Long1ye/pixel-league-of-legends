<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>正常游玩画质对照</title><style>body{margin:0;background:#101721;color:#dce5ed;font:16px system-ui}header{padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}button,select{padding:8px;background:#243448;color:inherit;border:1px solid #546578;border-radius:5px}#scene{position:relative;max-width:1600px;aspect-ratio:16/9;margin:auto;overflow:hidden}img{position:absolute;width:100%;height:100%;object-fit:contain}#top{clip-path:inset(0 50% 0 0)}input{width:240px}p{margin:8px 24px;color:#a4b5c6}b{font-size:13px;background:#101721b0;padding:6px;position:absolute;top:12px;z-index:2}#left{left:12px}#right{right:12px}</style><header><strong>正常游玩 · 45° · 缩放 0.6</strong><button id="play">播放走动</button><select id="frames"></select><label>基础 / 当前优化 <input id="split" type="range" value="50"></label></header><div id="scene"><img id="base"><img id="top"><b id="left">基础</b><b id="right">当前优化</b></div><p>同一比赛状态、同一动作帧、同一镜头。拖动分界线比较；播放为 2.0–3.5 秒的走动采样（每 0.1 秒一帧），不是帧率测试。角色没有被传送或修改属性。当前优化包含全部画质轮次。</p><script>const frames=[{"index":0,"label":"正常比赛 0.0 秒"},{"index":1,"label":"正常比赛 1.0 秒"},{"index":2,"label":"正常比赛 2.0 秒"},{"index":3,"label":"正常比赛 2.1 秒"},{"index":4,"label":"正常比赛 2.2 秒"},{"index":5,"label":"正常比赛 2.3 秒"},{"index":6,"label":"正常比赛 2.4 秒"},{"index":7,"label":"正常比赛 2.5 秒"},{"index":8,"label":"正常比赛 2.6 秒"},{"index":9,"label":"正常比赛 2.7 秒"},{"index":10,"label":"正常比赛 2.8 秒"},{"index":11,"label":"正常比赛 2.9 秒"},{"index":12,"label":"正常比赛 3.0 秒"},{"index":13,"label":"正常比赛 3.1 秒"},{"index":14,"label":"正常比赛 3.2 秒"},{"index":15,"label":"正常比赛 3.3 秒"},{"index":16,"label":"正常比赛 3.4 秒"},{"index":17,"label":"正常比赛 3.5 秒"},{"index":18,"label":"正常比赛 5.0 秒"},{"index":19,"label":"正常比赛 8.0 秒"},{"index":20,"label":"正常比赛 12.0 秒"},{"index":21,"label":"正常比赛 18.0 秒"},{"index":22,"label":"正常比赛 24.0 秒"},{"index":23,"label":"正常比赛 30.0 秒"},{"index":24,"label":"正常比赛 36.0 秒"},{"index":25,"label":"正常比赛 39.8 秒 · 阵亡"}];const select=document.querySelector('#frames'),topImage=document.querySelector('#top');frames.forEach(f=>select.add(new Option(f.label,f.index)));function show(i){select.value=i;document.querySelector('#base').src=String(i).padStart(2,'0')+'-enhanced.jpg';topImage.src=String(i).padStart(2,'0')+'-baseline.jpg'}select.onchange=()=>show(+select.value);document.querySelector('#split').oninput=e=>topImage.style.clipPath='inset(0 '+(100-e.target.value)+'% 0 0)';let timer;document.querySelector('#play').onclick=()=>{if(timer){clearInterval(timer);timer=null;return}let i=2;show(i);timer=setInterval(()=>{i=i>=17?2:i+1;show(i)},100)};show(0);</script></html>
