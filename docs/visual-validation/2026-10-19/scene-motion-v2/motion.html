<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>场景动态修订对照</title><style>body{margin:0;background:#101721;color:#dce5ed;font:16px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}img{display:block;width:100%;max-width:1600px;margin:auto}button,select{padding:8px}</style><header><button id="play">暂停播放</button><select id="version"><option value="current">本轮修订</option><option value="previous">上轮记录</option></select><select id="scene"><option value="bridge">桥面：火盆 / 冰晶</option><option value="wall">靠墙：塔核心 / 挂旗</option></select><span>45° · 缩放 0.6 · 固定镜头 · 16 张/秒采样，非帧率测试</span></header><img id="frame" src="bridge-00.jpg"><script>let i=0,playing=true;function show(){const prefix=document.querySelector('#version').value==='previous'?'../scene-motion/':'';document.querySelector('#frame').src=prefix+document.querySelector('#scene').value+'-'+String(i).padStart(2,'0')+'.jpg'}document.querySelector('#scene').onchange=show;document.querySelector('#version').onchange=show;document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停播放':'继续播放'};setInterval(()=>{if(playing){i=(i+1)%48;show()}},62.5)</script></html>
