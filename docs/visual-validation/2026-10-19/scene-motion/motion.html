<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>场景持续动态</title><style>body{margin:0;background:#101721;color:#dce5ed;font:16px system-ui}header{padding:12px}img{display:block;width:100%;max-width:1600px;margin:auto}button,select{padding:8px;margin-right:12px}</style><header><button id="play">暂停播放</button><select id="scene"><option value="bridge">桥面：草丛 / 火盆 / 水晶</option><option value="wall">靠墙：旗帜 / 壁灯</option></select>固定 45° · 正常缩放 0.6 · 镜头与单位静止，仅环境时间推进。16 张/秒采样，不代表游戏帧率。</header><img id="frame" src="bridge-00.jpg"><script>let i=0,playing=true;const frames={};for(const scene of ['bridge','wall'])frames[scene]=Array.from({length:48},(_,n)=>{const img=new Image;img.src=scene+'-'+String(n).padStart(2,'0')+'.jpg';return img});function show(){document.querySelector('#frame').src=frames[document.querySelector('#scene').value][i].src}document.querySelector('#scene').onchange=show;document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停播放':'继续播放'};setInterval(()=>{if(playing){i=(i+1)%48;show()}},62.5)</script></html>
