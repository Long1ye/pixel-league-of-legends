<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>积雪修订 · 实机画面对照</title><link rel="icon" href="data:,">
<style>
body{margin:0;background:#111925;color:#e0e9f2;font:16px system-ui}header{padding:16px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}select,button{font:inherit;color:inherit;background:#26374c;padding:8px 12px;border:1px solid #536680;border-radius:6px}label{display:flex;align-items:center;gap:10px}input{width:220px}.scene{max-width:1600px;aspect-ratio:16/9;position:relative;margin:auto;overflow:hidden}.scene img{position:absolute;width:100%;height:100%;object-fit:contain}#old{clip-path:inset(0 50% 0 0)}.tag{position:absolute;top:12px;background:#101722c9;padding:7px 10px;border-radius:5px}.left{left:12px}.right{right:12px}p{margin:16px 22px;color:#adbdcf;line-height:1.7}a{color:#8dcbff}
</style>
<header><strong>积雪修订 · 实机画面对照</strong><select id="camera"><option value="bridge">桥面与垂冰</option><option value="wall" selected>墙根与火盆</option><option value="red">红方外塔</option><option value="central">中央桥段</option><option value="sanctuary">蓝方圣所</option></select><select id="mode"><option value="rejected">上一版 / 积雪修订</option><option value="baseline">关闭 / 开启冰雪景观</option></select><label>左右分界 <input type="range" id="split" value="50" min="0" max="100"></label><button id="before">只看左侧</button><button id="after">只看修订后</button></header>
<div class="scene"><img id="new" alt="加入冰雪景观后的实际截图"><img id="old" alt="关闭本轮效果的实际截图"><span class="tag left">修改前</span><span class="tag right">加入后</span></div>
<p>本次移除了贴在地面的白色雪斑，接入有雪帽、覆石、凹陷和碎雪边缘的浅浮雕素材及接触影。墙根和桥面可对照被否定的上一版历史截图；两者保持同镜头，但不作为严格的当前代码开关隔离。其他区域自动比较本版关闭 / 开启「冰雪景观」，来自相同模拟时间。没有加入浮雕、残旗和盾牌组合。<a href="/three.html?map=howling&scene=ice">进入游戏查看墙根</a></p>
<p>当前游戏已加入八种积雪形态：<a href="../snow-varieties/comparison.html">查看最新九视角实机对照 →</a></p>
<script>
const camera=document.querySelector('#camera'),mode=document.querySelector('#mode'),range=document.querySelector('#split'),old=document.querySelector('#old'),current=document.querySelector('#new');
function show(){const rejected=mode.value==='rejected'&&['wall','bridge'].includes(camera.value);old.src=rejected?'rejected-'+camera.value+'.jpg':camera.value+'-before.jpg';current.src=camera.value+'-after.jpg';document.querySelector('.left').textContent=rejected?'上一版（用户否定）':'关闭冰雪景观';document.querySelector('.right').textContent='积雪修订实机'}
function split(value){range.value=value;old.style.clipPath='inset(0 '+(100-value)+'% 0 0)'}
camera.onchange=show;mode.onchange=show;range.oninput=()=>split(range.value);document.querySelector('#before').onclick=()=>split(100);document.querySelector('#after').onclick=()=>split(0);show();
</script></html>
