<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>积雪遮挡修正 · 实机对照</title>
<style>body{margin:0;background:#111925;color:#e0e9f2;font:16px system-ui}header{padding:16px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}select,button{font:inherit;color:inherit;background:#26374c;padding:8px 12px;border:1px solid #536680;border-radius:6px}input{width:220px}.scene{max-width:1600px;aspect-ratio:16/9;position:relative;margin:auto;overflow:hidden}.scene img{position:absolute;width:100%;height:100%;object-fit:contain}#old{clip-path:inset(0 50% 0 0)}.tag{position:absolute;top:12px;background:#101722c9;padding:7px 10px}.left{left:12px}.right{right:12px}p{margin:16px 22px;color:#adbdcf;line-height:1.7}a{color:#8dcbff}</style>
<header><strong>积雪遮挡修正 · 实机对照</strong><select id="camera"><option value="blue-poro">蓝方魄罗</option><option value="crystals">墙脚冰晶</option><option value="sanctuary">圣所魄罗</option><option value="red-poro">红方魄罗</option><option value="central-poro">中央魄罗</option><option value="normal">正常比例</option></select><input id="split" type="range" min="0" max="100" value="50"><button id="before">修正前</button><button id="after">修正后</button></header>
<div class="scene"><img id="new" alt="修正后实机"><img id="old" alt="修正前实机"><span class="tag left">修正前</span><span class="tag right">修正后</span></div>
<p>相同位置、45° 镜头、同一模拟时间。近景缩放 1 或 0.85，正常比例 0.6。雪堆按完整轮廓避让魄罗的整个活动范围和原有冰晶；对冲突积雪平移、缩小或移除。保留正常深度测试，未把魄罗或冰晶强制置于顶层。<a href="/three.html?map=howling&scene=ice">进入游戏检查</a></p>
<script>const camera=document.querySelector('#camera'),old=document.querySelector('#old'),current=document.querySelector('#new'),range=document.querySelector('#split');function show(){old.src=camera.value+'-before.jpg';current.src=camera.value+'-after.jpg'}function split(v){range.value=v;old.style.clipPath='inset(0 '+(100-v)+'% 0 0)'}camera.onchange=show;range.oninput=()=>split(range.value);document.querySelector('#before').onclick=()=>split(100);document.querySelector('#after').onclick=()=>split(0);show();</script></html>
