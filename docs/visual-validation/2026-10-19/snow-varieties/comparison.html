<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>八种积雪 · 实机画面对照</title><link rel="icon" href="data:,">
<style>
body{margin:0;background:#111925;color:#e0e9f2;font:16px system-ui}header{padding:16px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}select,button{font:inherit;color:inherit;background:#26374c;padding:8px 12px;border:1px solid #536680;border-radius:6px}label{display:flex;align-items:center;gap:10px}input{width:220px}.scene{max-width:1600px;aspect-ratio:16/9;position:relative;margin:auto;overflow:hidden}.scene img{position:absolute;width:100%;height:100%;object-fit:contain}#old{clip-path:inset(0 50% 0 0)}.tag{position:absolute;top:12px;background:#101722c9;padding:7px 10px;border-radius:5px}.left{left:12px}.right{right:12px}p{margin:16px 22px;color:#adbdcf;line-height:1.7}a{color:#8dcbff}
</style>
<header><strong>八种积雪 · 实机画面对照</strong><select id="camera"><option value="bridge">桥面</option><option value="wall" selected>墙根</option><option value="red">红方外塔</option><option value="central">中央桥段</option><option value="sanctuary">蓝方圣所</option><option value="fire">火盆融雪</option><option value="grass">草根积雪</option><option value="crust">冻融雪壳</option><option value="post">柱脚与薄雪</option></select><label>左右分界 <input type="range" id="split" value="50" min="0" max="100"></label><button id="before">只看上一版</button><button id="after">只看八种形态</button></header>
<div class="scene"><img id="new" alt="加入冰雪景观后的实际截图"><img id="old" alt="关闭本轮效果的实际截图"><span class="tag left">修改前</span><span class="tag right">加入后</span></div>
<p>同一镜头、同一模拟时间，仅切换「上一版单种覆石积雪 / 八种积雪形态」，晶光、薄冰、垂冰与其他画质保持一致。厚雪、碎石、风脊、薄雪、柱脚、融雪、草根、冻融雪壳已按区域接入。<a href="/three.html?map=howling&scene=ice">进入游戏查看墙根</a> · <a href="snow-contact.jpg">角色走到雪边的实机截图</a> · <a href="/assets/map-modules/howling-snow-varieties-v1/atlas.png">透明素材图集</a></p>
<p>后续已修正魄罗和冰晶被积雪遮挡的问题：<a href="../snow-occlusion/comparison.html">查看最新遮挡修正实机对照 →</a></p>
<script>
const camera=document.querySelector('#camera'),range=document.querySelector('#split'),old=document.querySelector('#old'),current=document.querySelector('#new');
function show(){old.src=camera.value+'-before.jpg';current.src=camera.value+'-after.jpg';document.querySelector('.left').textContent='上一版单种覆石积雪';document.querySelector('.right').textContent='八种形态实机'}
function split(value){range.value=value;old.style.clipPath='inset(0 '+(100-value)+'% 0 0)'}
camera.onchange=show;range.oninput=()=>split(range.value);document.querySelector('#before').onclick=()=>split(100);document.querySelector('#after').onclick=()=>split(0);show();
</script></html>
