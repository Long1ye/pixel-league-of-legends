<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>水晶与石座遮挡修复</title><style>body{margin:0;background:#16202b;color:#dce5ef;font:16px system-ui}header{padding:12px}img{display:block;max-width:100%;margin:auto}button,select{padding:8px;margin-right:12px}</style><header><button id="play">暂停</button><select id="team"><option value="blue">蓝方</option><option value="red">红方</option></select>检查水晶底部与前方石尖 · 发光和旗帜冻结，仅水晶悬浮 · 5 张/秒采样</header><img id="frame" src="blue-00.jpg"><script>let n=0,playing=true;const img=document.querySelector('#frame'),team=document.querySelector('#team');function show(){img.src=team.value+'-'+String(n).padStart(2,'0')+'.jpg'}document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放'};team.onchange=show;setInterval(()=>{if(playing){n=(n+1)%24;show()}},200)</script></html>
