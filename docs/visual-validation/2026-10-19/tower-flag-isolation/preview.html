<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>塔旗隔离修复</title><style>body{margin:0;background:#16202b;color:#dae5ef;font:16px system-ui}header{padding:14px}img{display:block;max-width:100%;margin:auto}button,select{padding:8px;margin-right:12px}</style><header><button id="play">暂停</button><select id="team"><option value="blue">蓝方塔旗</option><option value="red">红方塔旗</option></select>旗布运动隔离近景 · 水晶发光/悬浮冻结以检查塔身 · 8 张/秒采样，非性能基准</header><img id="frame" src="blue-00.jpg"><script>let frame=0,play=true;const img=document.querySelector('#frame'),team=document.querySelector('#team');function show(){img.src=team.value+'-'+String(frame).padStart(2,'0')+'.jpg'}document.querySelector('#play').onclick=e=>{play=!play;e.target.textContent=play?'暂停':'播放'};team.onchange=show;setInterval(()=>{if(play){frame=(frame+1)%16;show()}},125)</script></html>
