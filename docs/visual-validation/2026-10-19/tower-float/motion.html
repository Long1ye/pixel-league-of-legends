<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>防御塔水晶悬浮</title><style>body{margin:0;background:#101721;color:#dce5ed;font:16px system-ui}header{padding:14px;display:flex;gap:16px;align-items:center}img,video{display:block;width:100%;max-width:1600px;margin:auto}select,button{padding:7px}a{color:#a9d5ff}</style><header><select id="team"><option value="blue">蓝方水晶悬浮</option><option value="red">红方水晶悬浮</option><option value="original">原版对照</option></select><button id="play">暂停</button><span>45° · 正常缩放 0.6 · 水晶独立浮动，塔身固定</span><a href="/three.html?map=howling&scene=match">进入比赛</a></header><video id="video" src="blue.webm" autoplay loop muted playsinline controls></video><img id="frame" src="original.jpg" style="display:none"><script>const select=document.querySelector('#team'),video=document.querySelector('#video'),frame=document.querySelector('#frame');select.onchange=()=>{const original=select.value==='original';video.style.display=original?'none':'block';frame.style.display=original?'block':'none';if(original)video.pause();else{video.src=select.value+'.webm';video.play()}};document.querySelector('#play').onclick=e=>{if(video.paused){video.play();e.target.textContent='暂停'}else{video.pause();e.target.textContent='播放'}}</script></html>
